version: '3.8'

services:
  # Main Spring Boot Application
  optical-shop-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optical-shop-erp
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_APPLICATION_NAME=optical-shop-erp
      - SERVER_PORT=8080
    volumes:
      # Optional: Mount source code for live reload during development
      # Uncomment to enable hot-reload (requires Spring DevTools)
      # - ./src:/app/src
      # Mount logs directory
      - ./logs:/app/logs
    networks:
      - optical-network
    # Wait for app to be healthy before marking as up
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Optional: MySQL Database (uncomment to use MySQL instead of H2)
  # mysql-db:
  #   image: mysql:8.0.35
  #   container_name: optical-shop-mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpassword
  #     MYSQL_DATABASE: optical_shop_erp
  #     MYSQL_USER: optical_user
  #     MYSQL_PASSWORD: opticalshop123
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #     - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
  #   networks:
  #     - optical-network
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  # Optional: phpMyAdmin for MySQL inspection
  # phpmyadmin:
  #   image: phpmyadmin:latest
  #   container_name: optical-shop-phpmyadmin
  #   environment:
  #     PMA_HOST: mysql-db
  #     PMA_USER: optical_user
  #     PMA_PASSWORD: opticalshop123
  #   ports:
  #     - "8081:80"
  #   depends_on:
  #     - mysql-db
  #   networks:
  #     - optical-network
  #   restart: unless-stopped

networks:
  optical-network:
    driver: bridge

volumes: {}
